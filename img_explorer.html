<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image metadata explorer</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; margin: 0; }
    #status { padding: 8px 12px; background: #f6f6f9; border-bottom: 1px solid #e0e0e6; color: #333; }
    iframe { border: 0; width: 100%; height: calc(100vh - 40px); }
  </style>
</head>
<body>
  <div id="status">Checking best endpoint…</div>
  <iframe id="appFrame" src="about:blank" title="Image metadata explorer"></iframe>

  <script>
  (function(){
    const NERSC = 'http://img-metadata-explorer.shiny-singlecell.development.svc.spin.nersc.org/';
    const FALLBACK = 'https://b46mns-robert-bowers.shinyapps.io/img_metadata_explorer_shinyio/';
    const TIMEOUT_MS = 8000;
    const statusEl = document.getElementById('status');
    const iframe = document.getElementById('appFrame');

    // If page is served over HTTPS, embedding an http: iframe will be blocked by the browser.
    if (location.protocol === 'https:' && NERSC.startsWith('http:')) {
      statusEl.innerHTML = 'Cannot embed NERSC over HTTP from this secure page — using fallback. <a href="' + NERSC + '" target="_blank" rel="noopener">Open NERSC in a new tab</a>';
      iframe.src = FALLBACK;
      return;
    }

    // Otherwise try NERSC first, then fallback after timeout.
    iframe.src = NERSC;
    let fallbackUsed = false;
    const t = setTimeout(() => {
      if (!fallbackUsed) {
        fallbackUsed = true;
        statusEl.textContent = 'NERSC did not respond — falling back to shinyapps.io';
        iframe.src = FALLBACK;
      }
    }, TIMEOUT_MS);

    iframe.addEventListener('load', () => {
      clearTimeout(t);
      statusEl.textContent = iframe.src.indexOf(FALLBACK) !== -1 ? 'Loaded (fallback)' : 'Loaded (NERSC)';
    });

    statusEl.addEventListener('click', () => {
      if (!fallbackUsed) {
        fallbackUsed = true;
        clearTimeout(t);
        statusEl.textContent = 'Switching to fallback (requested)';
        iframe.src = FALLBACK;
      }
    });
  })();
  </script>
</body>
</html>
