<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IMG Isolate Genome Worldmap</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px;
      background: #fafafa;
    }
    button {
      font-size: 16px;
      padding: 12px 20px;
      cursor: pointer;
      margin-top: 20px;
    }
    #status {
      margin-top: 20px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

<h2>IMG Isolate Genome Worldmap</h2>

<p>
  This Shiny app is hosted on NERSC Spin (preferred).
  <br>
  If NERSC is unavailable, it will open the shinyapps.io version.
</p>

<button id="openApp">Open Worldmap Shiny App</button>

<div id="status">Checking NERSC availability…</div>

<script>
  const NERSC_URL =
    "http://shiny-app-worldmap.shiny-singlecell.development.svc.spin.nersc.org/";
  const FALLBACK_URL =
    "https://b46mns-robert-bowers.shinyapps.io/shiny_app_worldmap/";

  let targetURL = FALLBACK_URL;

  // Probe NERSC availability
  const img = new Image();

  img.onload = () => {
    targetURL = NERSC_URL;
    document.getElementById("status").textContent =
      "NERSC available — will open Spin-hosted app.";
  };

  img.onerror = () => {
    document.getElementById("status").textContent =
      "NERSC unavailable — will open shinyapps.io fallback.";
  };

  // Real HTTP request (important)
  img.src = NERSC_URL + "favicon.ico?" + Date.now();

  document.getElementById("openApp").addEventListener("click", () => {
    window.open(targetURL, "_blank", "noopener");
  });
</script>

</body>
</html>
