<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image worldmap explorer</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; margin: 0; }
    #status { padding: 8px 12px; background: #f6f6f9; border-bottom: 1px solid #e0e0e6; color: #333; }
    iframe { border: 0; width: 100%; height: calc(100vh - 40px); }
  </style>
</head>
<body>
  <div id="status">Attempting to load the faster NERSC instance… (click to force fallback)</div>
  <iframe id="appFrame" src="http://shiny-app-worldmap.shiny-singlecell.development.svc.spin.nersc.org/" title="Image worldmap explorer"></iframe>

  <script>
    (function(){
      const NERSC = 'http://shiny-app-worldmap.shiny-singlecell.development.svc.spin.nersc.org/';
      const FALLBACK = 'https://b46mns-robert-bowers.shinyapps.io/shiny_app_worldmap/';
      const TIMEOUT_MS = 8000;
      const statusEl = document.getElementById('status');
      const iframe = document.getElementById('appFrame');

      let fallbackUsed = false;
      const t = setTimeout(() => {
        if (!fallbackUsed) {
          fallbackUsed = true;
          statusEl.textContent = 'NERSC did not respond — falling back to shinyapps.io';
          iframe.src = FALLBACK;
        }
      }, TIMEOUT_MS);

      iframe.addEventListener('load', () => {
        clearTimeout(t);
        if (iframe.src.indexOf(FALLBACK) !== -1 || fallbackUsed) {
          statusEl.textContent = 'Loaded (fallback)';
        } else {
          statusEl.textContent = 'Loaded (NERSC)';
        }
      });

      statusEl.addEventListener('click', () => {
        if (!fallbackUsed) {
          fallbackUsed = true;
          clearTimeout(t);
          statusEl.textContent = 'Switching to fallback (requested)';
          iframe.src = FALLBACK;
        }
      });
    })();
  </script>
</body>
</html>
